name: Daily check
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      # A code change only redeploys; sources are checked on the schedule or by hand.
      - name: Check sources
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 scripts/collect.py
      - name: Save results
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add data/opportunities.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update opportunities'
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then echo 'Could not save after three attempts' >&2; exit 1; fi
            cp data/opportunities.json /tmp/opportunities.json
            git fetch --depth=1 origin main
            git reset --hard origin/main
            cp /tmp/opportunities.json data/opportunities.json
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report failed check
        if: steps.collect.outcome == 'failure'
        run: exit 1
